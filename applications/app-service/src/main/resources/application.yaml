server:
  port: 8072
spring:
  application:
    name: "UserService"
  devtools:
    add-properties: false
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "usersdb"
    schema: "public"
    username: "app"
    password: "secret"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: "mySecretKey123456789012345678901234567890"
  expiration: 3600
adapter:
  sqs:
    region: "us-east-1"
    queueUrl: "http://localhost:4566/000000000000/sample"
    endpoint: "http://localhost:4566 # For localstack only"
