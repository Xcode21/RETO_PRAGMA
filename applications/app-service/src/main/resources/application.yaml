server:
  port: 8072
spring:
  application:
    name: "UserService"
  devtools:
    add-properties: false
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "usersdb"
    schema: "public"
    username: "app"
    password: "secret"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
